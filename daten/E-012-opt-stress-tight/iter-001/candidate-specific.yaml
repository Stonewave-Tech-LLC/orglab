name: B_minimal_tight~i1s
description: Shared board; execute only on verified dependencies; a failed inspect
  leads to re-execute, then escalation; downstream items are re-checked after a root
  is redone.
n_agents: 4
topology: mesh
board: true
shared_notes: false
human_channel: anyone
role_mode: none
roles: []
norms:
- Before executing an item, inspect each of its dependencies. Execute it only if every
  dependency's inspect passes now; otherwise work on something else and tell the dependency's
  owner what is blocking you.
- After every execute, inspect the item before doing anything else with it. If the
  inspect fails, read the failure, re-execute once, and inspect again. If it still
  fails, contact_human with the inspect text instead of reporting done.
- When a dependency is re-executed after a failure, the owners of items built on it
  must re-inspect those items (and re-execute them if needed) before treating them
  as done.
- 'Work in dependency order: roots first, then their chains. A done report always
  rests on an inspect pass made after both the item and all of its dependencies were
  last executed.'
max_ticks: 8
max_tool_calls: 4
